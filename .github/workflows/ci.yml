name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  desktop-tests:
    # macOS runner: the ionspin libsodium native lib loads reliably here, matching the
    # dev environment. Keychain / pasteboard / AWT tests self-skip under CI (headless).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared unit tests
        run: ./gradlew :shared:desktopTest --stacktrace

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: yes | sdkmanager --licenses > /dev/null && sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace
